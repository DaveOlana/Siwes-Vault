services:
  postgres:
    image: postgres:16-alpine
    container_name: siwes-vault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: siwes_dev_password
      POSTGRES_DB: siwes_vault
    ports:
      - "5433:5432"
    volumes:
      - siwes_vault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siwes_vault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  siwes_vault_pgdata:
